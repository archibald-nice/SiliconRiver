# 厂商头像来源映射表（provider_id 与 models.provider / providers.provider_id 完全一致，区分大小写）
#
# 来源优先级固定为：LobeHub SVG → LobeHub PNG → GitHub org 头像 → Google favicon。
# 理由见 /tmp/logo-sources-report.md 与 src/scraper/provider_logos.py 的模块注释。
#
# 字段（除 provider 外都可省略）：
#   provider      必填，与数据库里的 provider_id 逐字符一致
#   display_name  可选，写进 providers.display_name（省略则保留库里已有的名字）
#   lobe_slug     LobeHub 图标 slug；不确定就留空，空值会自动落到下一级来源
#   github_org    GitHub 组织名；**撞名的不要填**（填了就会抓到别家公司的头像）
#   domain        兜底 favicon 用；没有可信域名就留空
#   enabled       false = 明确不下载（真人头像 / 三源都查不到），脚本直接跳过
#   note          给人看的说明，脚本不解析
#
# 维护提示：新增厂商先查 LobeHub（https://lobehub.com/icons）有没有方形品牌图标，
# 没有再填 GitHub org，并且必须点开确认这个 org 真的是这家公司——GitHub 上撞名比
# 想象的多（本表已踩到 perceptron / typesafehub / aionlabs 三个）。

