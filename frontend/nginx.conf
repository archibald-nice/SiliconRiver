server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 启用 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # 静态资源缓存（带有哈希的文件名可以长期缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 请求说明（此配置仅服务静态文件，API 请求由前端直接发往后端）
    # 如果后端和前端在同一域名下，可以在这里添加反向代理：
    # location /api/ {
    #     proxy_pass http://backend-server:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # SPA 路由支持：只对不存在的真实路由返回 index.html
    # 关键：先检查文件是否存在，只有真正的路由才返回 index.html
    location / {
        # 如果文件存在就返回文件
        # 如果目录存在就进入目录
        # 都不存在，说明是 React 路由，返回 index.html
        try_files $uri $uri/ /index.html;
    }

    # 确保静态资源总是直接返回，不会被 try_files 重定向
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 健康检查端点（可选）
    location /health {
        access_log off;
        return 200 "Frontend OK\n";
        add_header Content-Type text/plain;
    }
}
